name: Release

# Tag a commit to ship a build:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*"]
  # Lets you publish from the Actions tab without pushing a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle
        run: ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent "build/Swift Paste.app" "SwiftPaste.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: SwiftPaste.zip
          generate_release_notes: true
          body: |
            Download `SwiftPaste.zip`, unzip, and drag **Swift Paste.app** to Applications.

            The build is ad-hoc signed, so on first launch right-click the app and choose
            **Open**, then grant Accessibility in
            System Settings › Privacy & Security › Accessibility.
