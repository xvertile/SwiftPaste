name: Release

# Tag a commit to ship a build:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*"]
  # Lets you publish from the Actions tab without pushing a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The tag is the single source of truth for the version, so a release can
      # never ship a bundle whose About pane disagrees with its own download page.
      - name: Set version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $TAG"

      - name: Build app bundle
        run: ./build.sh

      - name: Verify the bundle
        run: |
          test -x "build/Swift Paste.app/Contents/MacOS/SwiftPaste"
          test -f "build/Swift Paste.app/Contents/Resources/AppIcon.icns"
          codesign --verify --strict "build/Swift Paste.app"
          PLIST="build/Swift Paste.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" \
             = "${{ steps.version.outputs.version }}"
          echo "bundle OK"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/Swift Paste.app" "SwiftPaste.zip"
          Tools/make-dmg.sh SwiftPaste.dmg
          shasum -a 256 SwiftPaste.zip SwiftPaste.dmg | tee checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Swift Paste ${{ steps.version.outputs.version }}
          files: |
            SwiftPaste.dmg
            SwiftPaste.zip
            checksums.txt
          generate_release_notes: true
          body: |
            ## Install

            Download **SwiftPaste.dmg**, open it, and drag Swift Paste to Applications.

            On first launch, grant Accessibility in System Settings › Privacy & Security ›
            Accessibility. Swift Paste needs it to see the double ⌥ tap and to paste for you.

            ## Requirements

            macOS 13 or later, Apple silicon or Intel.

            ## Verifying this build

            This build was produced by GitHub Actions from the tagged source — the run that
            made it is linked under this release. `checksums.txt` has the SHA-256 of both files.
